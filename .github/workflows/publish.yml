name: Publish to npm
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'First publish: approve npm browser links in the job log, then configure trusted publishing'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: npm install --global npm@11.21.1
      - name: Check npm trusted-publisher authentication
        if: ${{ !inputs.bootstrap }}
        run: node scripts/check-publish-auth.mjs
      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); if (process.env.RELEASE_TAG !== `v${p.version}`) throw new Error("Release tag must match package.json");'
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:bun
      - run: npx playwright install --with-deps --no-shell chromium
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: artifacts/*.tgz
      # A new npm package must exist before its trusted publisher can be configured.
      # This one-time login runs entirely on the GitHub runner. No token secret is needed.
      - name: Sign in to npm for the first publish
        id: npm_login
        if: inputs.bootstrap
        timeout-minutes: 17
        run: |
          for attempt in 1 2 3; do
            echo "::notice::npm sign-in attempt ${attempt}/3. Open the newest login link below and complete approval before it expires."
            if npm login --auth-type=web --no-browser </dev/null; then
              exit 0
            fi
          done
          echo "::error::npm sign-in did not complete. Re-run with bootstrap=true for a new link."
          exit 1
      - name: Publish validated tarball
        timeout-minutes: 15
        # Browser 2FA requires terminal streams; ordinary OIDC releases do not prompt.
        run: script -q -e -c 'npm publish ./artifacts/*.tgz --access public --provenance --no-browser' /dev/null
      - name: Configure trusted publishing for future releases
        if: inputs.bootstrap
        timeout-minutes: 10
        run: script -q -e -c 'npm trust github mssql-dacfx --repo iteufel/mssql-project-sql --file publish.yml --allow-publish --yes --no-browser' /dev/null
      - name: Remove bootstrap login
        if: always() && inputs.bootstrap && steps.npm_login.outcome == 'success'
        run: npm logout --registry=https://registry.npmjs.org
