name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '22'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:bun
      - run: npx playwright install --with-deps --no-shell chromium
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ matrix.os }}-node-${{ matrix.node }}
          path: artifacts/*.tgz
